name: CI Test & Quality Suite

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Lint Tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Format Check
        run: ruff format --check .

      - name: Run Ruff Linter
        run: ruff check .

  test:
    name: Test Suite (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libnotify-bin libsecret-1-dev libglib2.0-dev dbus

      - name: Install Package & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pytest-cov

      - name: Run Pytest Suite with Coverage
        run: |
          pytest --cov=uniwifi --cov-report=term-missing -v

  packaging-check:
    name: Fedora RPM Packaging Check
    runs-on: ubuntu-latest
    container:
      image: fedora:latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Fedora Build Dependencies
        run: |
          dnf install -y \
            python3-devel \
            pyproject-rpm-macros \
            systemd-rpm-macros \
            rpm-build \
            rpmlint \
            tar \
            gzip \
            git

      - name: Validate Spec File Syntax
        run: |
          rpmlint packaging/uniwifi.spec || true

      - name: Test Build RPM Script
        run: |
          ./scripts/build_rpm.sh --srpm
